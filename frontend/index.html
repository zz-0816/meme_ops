<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meme_ops — Web3 Meme Intelligence</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶部导航 -->
<nav class="topnav">
    <button class="topnav-brand brand-button" onclick="switchTab('overview')" aria-label="Open meme_ops overview">meme_ops</button>
    <div class="topnav-tabs">
        <button class="topnav-tab active" data-tab="overview" onclick="switchTab('overview')">Overview</button>
        <button class="topnav-tab" data-tab="community" onclick="switchTab('community')">Community</button>
        <button class="topnav-tab" data-tab="analysis" onclick="switchTab('analysis')">Analyze</button>
        <button class="topnav-tab" data-tab="profile" onclick="switchTab('profile')">Home</button>
    </div>
    <div class="topnav-wallet">
        <span class="wallet-addr" id="walletAddr" style="display:none;"></span>
        <button class="btn-wallet" id="btnWallet" onclick="connectWallet()">Connect Wallet</button>
    </div>
</nav>

<!-- 主体布局 -->
<div class="main-layout">

    <!-- 左侧栏（仅分析 Tab 可见） -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-tabs">
            <button class="sidebar-tab active" onclick="location.hash='#/watchlist'">Watchlist</button>
        </div>
        <div id="sidebarContent"></div>
    </aside>

    <!-- 中央主区域 -->
    <main class="main-content" id="mainContent"></main>
</div>

<!-- 加载遮罩 -->
<div class="loading-overlay hidden" id="loadingOverlay">
    <div class="spinner"></div>
    <p style="margin-top:16px;color:var(--text-muted);">Processing...</p>
</div>

<script src="app.js"></script>
</body>
</html>
